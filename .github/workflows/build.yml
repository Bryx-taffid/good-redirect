name: Build # The purpose is to build the project, and run tests (in the future)
on:
  pull_request:
    branches:
      - main


permissions: { }

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1
        with:
          persist-credentials: 'false'
      - name: pnpm (with runtime)
        uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e #v3.1.2
        with:
          require-lockfile: true
          install: false
          working-directory: './good-redirect'
          cache: true
      - name: Install the node packages
        run: pnpm ci
        working-directory: './good-redirect'
      - name: Build the browser extension
        run: pnpm run build
        working-directory: './good-redirect'
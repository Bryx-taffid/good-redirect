name: Build # The purpose is to build the project, and run tests (in the future)
on:
  pull_request:
    branches:
      - main


permissions: { }

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1
        with:
          persist-credentials: 'false'
      - name: pnpm (with runtime)
        uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b #v2.1.0
        with:
          version: ^11.21
          runtime: node@lts
      - name: Build the browser extension
        run: pnpm run build
        working-directory: good-redirect/